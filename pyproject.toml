[project]
name = "ai-cost-guardrail"
version = "0.1.0"
description = "AI Cost Guardrail - a production-oriented AI gateway for cost control and reliability"
authors = [
    { name = "Ayush Singh", email = "ayushs6875@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "alembic==1.19.1",
    "fastapi[standard]==0.141.1",
    "google-genai==2.17.0",
    "httpx==0.28.1",
    "pgvector>=0.5.0",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pyjwt==2.13.0",
    "pymupdf>=1.28.2",
    "redis==8.1.0",
    "sqlalchemy==2.0.51",
    "uvicorn==0.52.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyright>=1.1.413",
    "ruff>=0.16.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]