
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env

    environment:
        DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_guardrail
        REDIS_URL:  redis://redis:6379
    depends_on:
      - postgres
      - redis
  redis:
    image: redis:7-alpine
    container_name: ai-cost-guardrail-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: ai-cost-guardrail-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_guardrail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
